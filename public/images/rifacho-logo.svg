<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background transparent -->

  <!-- Icon: Modern Diamond / Lucky Ticket Symbol -->
  <g transform="translate(20, 20)">
    <!-- Outer shield -->
    <polygon points="55,0 110,25 110,85 55,110 0,85 0,25" fill="#111827" stroke="url(#redGradient)" stroke-width="4" />
    <!-- Inner diamond -->
    <polygon points="55,12 98,32 98,78 55,98 12,78 12,32" fill="url(#redGradient)" opacity="0.15" />
    <!-- Ticket / R letterform badge -->
    <path d="M40 32 H65 C76 32 82 38 82 47 C82 54 78 59 70 61 L84 80 H70 L58 63 H50 V80 H40 V32 Z M50 40 V55 H64 C70 55 73 52 73 47 C73 42 70 40 64 40 Z" fill="url(#goldGradient)" filter="url(#glow)" />
    <!-- Star accent -->
    <polygon points="55,18 57,24 63,24 58,28 60,34 55,30 50,34 52,28 47,24 53,24" fill="#FFFFFF" />
  </g>

  <!-- Main Wordmark: RIFACHO -->
  <text x="145" y="86" font-family="'Montserrat', 'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" letter-spacing="4" fill="url(#whiteGradient)">
    RIFA<tspan fill="url(#redGradient)">CHO</tspan>
  </text>

  <!-- Subtitle Tagline: SORTEOS & PREMIOS OFICIALES -->
  <text x="148" y="112" font-family="'Roboto', 'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="6" fill="url(#goldGradient)">
    SORTEOS &amp; PREMIOS OFICIALES
  </text>
  
  <!-- Subtle decorative speed lines -->
  <line x1="148" y1="124" x2="470" y2="124" stroke="url(#redGradient)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="475" cy="124" r="2.5" fill="#EAB308" />
</svg>
